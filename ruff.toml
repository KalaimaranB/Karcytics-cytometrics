line-length = 100
target-version = "py311"

[lint]
# Full Google-grade rule set — matches Karcytics core and exceeds it where relevant
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "D",      # pydocstyle
    "C90",    # McCabe complexity
    "PLR",    # Pylint refactor
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "A",      # flake8-builtins (shadowing)
    "RET",    # flake8-return
    "C4",     # flake8-comprehensions
    "ARG",    # flake8-unused-arguments
    "TID251", # banned imports (PyQt6 in analysis layer)
    "T20",    # flake8-print — stdout is the isolated-process msgpack IPC channel; a stray
              # print() corrupts the frame protocol (see ui_daemon.py / ui_daemon_runtime.py)
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E722",  # Bare excepts
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
    "D205",  # 1 blank line between summary and description
    "D417",  # Missing argument descriptions in docstring
    "B024",  # ABC with no abstract methods
    "B027",  # Empty hooks in ABCs without abstract decorator
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 7
max-branches = 12

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["karcytics_plugins"]

[lint.flake8-tidy-imports.banned-api]
"PyQt6" = { msg = "Do not import PyQt6. The analysis layer must not depend on UI frameworks." }

[lint.extend-per-file-ignores]
# UI files: Qt uses camelCase overrides and optional event args — relax naming/arg rules
"**/ui/**/*.py" = [
    "TID251",   # PyQt6 allowed in UI
    "N802", "N803", "N806", "N815",  # Qt camelCase conventions
    "ARG001", "ARG002", "ARG005",    # Qt event handlers have mandatory unused args
    "PLR0912", "PLR0915", "PLR0917", # Complex Qt widget methods are unavoidable
    "SIM102", "SIM105", "SIM108", "SIM110",  # Qt patterns don't always simplify cleanly
    "C408",    # dict() calls are idiomatic in Qt widget config
    "RET504",  # Early returns in Qt event handlers can reduce clarity
    "C901",    # Complex Qt widget orchestrators are architecturally unavoidable
]
# Numerical image-processing pipelines: sequential algorithm steps (threshold,
# distance transform, connected components, ...) don't benefit from arbitrary
# splitting just to satisfy a statement-count budget.
"**/analysis/pipelines/**/*.py" = ["PLR0915"]
"__init__.py" = ["TID251", "F401"]
# ui_daemon.py hosts the module's own QApplication/window in its own process
# (see karcytics_sdk.plugin.PluginUIDaemon) — same "UI, not analysis" exemption as
# ui/**, just conventionally required to live at the plugin root so the SDK's
# daemon script resolution can find it.
"ui_daemon.py" = [
    "TID251",
    "N802", "N803", "N806", "N815",
    "ARG001", "ARG002", "ARG005",
    "PLR0912", "PLR0917",
    "SIM102", "SIM105", "SIM108", "SIM110",
    "C408",
    "RET504",
    "C901",
]
# Tests: relax style/complexity so tests stay readable
"**/tests/**/*.py" = [
    "TID251", "PLR2004", "PLR0915", "PLR0913", "PLR0917",
    "B018", "D415", "F841",
    "ARG001", "ARG002", "ARG005",
    "N802", "N806",
    "SIM", "C4", "RET504",
    "T20",
]
