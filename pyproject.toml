[project]
name = "cytometrics"
version = "0.3.0"
description = "A Karcytics plugin for quantitative morphological analysis of multi-channel fluorescence microscopy images — covering image import, scale calibration, classical and AI-assisted (Cellpose) cell segmentation, manual annotation, and CSV export."
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
  { name = "Kalaimaran Balasothy" },
]
dependencies = [
    "karcytics-sdk>=2.0.1",
    "torch>=2.0",
    "torchvision>=0.15",
    "cellpose>=3.0",
    "opencv-python>=4.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0, <9.0",
    "pytest-qt>=4.3, <5.0",
    "pytest-cov>=4.1, <5.0",
    "pytest-timeout>=2.3, <3.0",
    "ruff>=0.16, <1.0",
    "mypy>=1.9, <2.0",
    "pip-audit>=2.7, <3.0",
    "pre-commit>=3.6, <4.0",
]

[tool.karcytics.plugin]
id = "cytometrics"
display_name = "CytoMetrics"
min_core_version = "2.0.0"
entry_point = "karcytics_plugins.cytometrics:initialize"
process_model = "isolated"
requires = ["task_scheduler", "logger", "event_bus"]
tags = ["morphology", "segmentation", "quantification", "fluorescence"]
homepage = "https://github.com/KalaimaranB/Karcytics-cytometrics"
# tests/ is excluded from the release ZIP (see .github/workflows/release.yml's
# "Build Release ZIP" step), so it must never be hashed into security.json either
# — otherwise the shipped ledger claims files that were never packaged, and
# install-time discovery correctly rejects the plugin as UNTRUSTED.
custom_exclusions = ["tests"]
description = "A Karcytics plugin for quantitative morphological analysis of multi-channel fluorescence microscopy images — covering image import, scale calibration, classical and AI-assisted (Cellpose) cell segmentation, manual annotation, and CSV export."
authors = [
  { name = "Kalaimaran Balasothy", role = "Lead Developer", permissions = ["sign_code"], github = "KalaimaranB" },
]
contributors = [
  { name = "Aamitoz Sharma", role = "Developer" },
]

[tool.karcytics.plugin.signing]
# Author's Ed25519 public key — trust root: Karcytics Core Authority → Kalaimaran Balasothy
# Same identity used across all of Kalaimaran's plugins (see Karcytics-flow-cytometry).
# Verified by trust_chain.json (signature issued by Karcytics Core Authority).
author_public_key = "4a2f07ed63d33c1b5aeb39405a7e7979d93d899836920818a6da317f65c6c6a5"

# Delegated keys: author signs for these identities (e.g. CI/CD bots)
# Verified by delegation.json (signature issued by author)
[[tool.karcytics.plugin.signing.delegated_keys]]
name = "Karcytics CytoMetrics CI Pipeline"
public_key = "5dedd21f2f390e1918241a7550ca5ae51320416281348bab359309b3e03632d1"
signed_by = "Kalaimaran Balasothy"
role = "ci_runner"


# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 120
timeout_method = "thread"
markers = [
    "unit: unit tests (fast, headless)",
    "ui: tests that require Qt/display",
    "integration: integration tests",
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs
module = [
    "PyQt6.*",
    "numpy.*",
    "cv2.*",
    "torch.*",
    "torchvision.*",
    "cellpose.*",
    "psutil.*",
    "karcytics_sdk.*",
    "karcytics.*",
    "sip.*",
    "requests.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.uv.sources]
karcytics-sdk = { path = "../Karcytics-SDK", editable = true }

[dependency-groups]
dev = [
    "pyqt6>=6.11.0, <7.0.0",
]
